{% load static %}
<div class="employee-card">
    <a href="{% url 'employee_detail' employee.id %}" class="employee-card__link">
        <div class="employee-card__body">
            <div class="employee-card__photo">
                {% if employee.images.all %}
                <img src="{{ employee.images.first.image.url }}" alt="Фото {{ employee.surname }} {{ employee.name }}">
                {% else %}
                <div class="employee-card__no-photo">Нет фото</div>
                {% endif %}
            </div>
            <div class="employee-card__info">
                <h3 class="employee-card__name">{{ employee.surname }} {{ employee.name }}</h3>
                <p class="employee-card__skills">
                    {% for skill in employee.skills.all %}
                    {{ skill.name }}{% if not forloop.last %}, {% endif %}
                    {% empty %}
                    Навыки не указаны
                    {% endfor %}
                </p>
            </div>
        </div>
    </a>
</div>
